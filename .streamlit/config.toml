[theme]
base = "light"
primaryColor = "#0066CC"
backgroundColor = "#FAFBFC"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#253242"
linkColor = "#0052A3"
borderColor = "#DDE5EC"
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "0.875rem"
linkUnderline = false

redColor = "#C62828"
redBackgroundColor = "#FDECEC"
redTextColor = "#8E1B1B"
orangeColor = "#B66A00"
orangeBackgroundColor = "#FFF4DE"
orangeTextColor = "#7A4600"
greenColor = "#16794C"
greenBackgroundColor = "#E9F7EF"
greenTextColor = "#0F5E3A"
blueColor = "#0066CC"
blueBackgroundColor = "#EAF3FF"
blueTextColor = "#004C99"
grayColor = "#607080"
grayBackgroundColor = "#EEF2F5"
grayTextColor = "#3F4E5C"

chartCategoricalColors = ["#C62828", "#E07000", "#C49500", "#16794C", "#0066CC", "#607080"]
chartDivergingColors = ["#8E1B1B", "#C62828", "#E57373", "#F9C4C4", "#FDECEC", "#EAF3FF", "#9BCBFF", "#4D9DFF", "#0066CC", "#004C99"]
dataframeBorderColor = "#DDE5EC"
dataframeHeaderBackgroundColor = "#EEF2F5"

[theme.sidebar]
backgroundColor = "#EEF4F8"
secondaryBackgroundColor = "#E3ECF2"
textColor = "#253242"
borderColor = "#D2DDE7"
primaryColor = "#0066CC"
